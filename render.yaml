# Бекенд Clarity на Render, безкоштовний тариф (Blueprint).
# Інтерфейс — на Vercel (frontend/vercel.json): він проксює /api і /shared сюди,
# тож для браузера це один домен і вхід у cookie працює як за nginx.
#
# Що дає безкоштовність (README, «Безкоштовно: Vercel + Render + Neon»):
# - база — Neon Free: безкоштовну базу Render видаляють через 30 днів;
# - воркера немає: дискусії йдуть потоками API (DISCUSSION_RUNNER=thread),
#   а листи журналу шле GitHub Actions (.github/workflows/reminders.yml);
# - Render Free блокує SMTP-порти 25/465/587 — пошта через Brevo на 2525;
# - після ~15 хв без запитів API засинає, перше відкриття — до хвилини.
#
# Render → New → Blueprint → цей репозиторій; значення `sync: false` Render
# попросить ввести під час створення.

services:
  - type: web
    name: clarity-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health/
    # preDeployCommand на Free недоступний — міграції перед стартом;
    # 2 процеси замість 3, щоб уміститися в 512 МБ
    dockerCommand: >-
      sh -c "python manage.py migrate --noinput &&
      exec gunicorn backend.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -"
    envVars:
      # той самий ключ — у секретах GitHub (листи журналу підписують посилання відписки).
      # Згенерувати: python3 -c "import secrets; print(secrets.token_urlsafe(50))"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      # Neon → Connection string (Direct connection), з ?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DISCUSSION_RUNNER
        value: thread
      - key: DISCUSSION_REMINDER_INTERVAL
        value: "0"
      # клієнт → Vercel → проксі Render → Django
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_NUM_PROXIES
        value: "2"
      # адреса сайту на Vercel, напр. https://clarity.vercel.app — посилання в листах
      - key: FRONTEND_URL
        sync: false
      # прев'ю /shared/ бере бандли з живого фронтенду: https://<сайт>/index.html
      - key: FRONTEND_INDEX_URL
        sync: false
      # пошта: Brevo (300 листів/день), порт 2525 — 587 на Render Free закритий
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "true"
      # Brevo → SMTP & API → SMTP: логін і SMTP-ключ (не API-ключ)
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # підтверджений у Brevo відправник, напр. Clarity <you@gmail.com>
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # хоча б один ключ моделі; безкоштовні — Groq, Gemini, Cerebras, OpenRouter
      - key: GROQ_API_KEY
        sync: false

# Коли знадобиться без компромісів (платно): plan: starter у clarity-api,
