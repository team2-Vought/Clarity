# Інтерфейс на Vercel після кожного push у main.
# Vercel Hobby не підключає приватні репозиторії організацій, тож замість
# Git-інтеграції деплоїть ця робота — так само, як `vercel deploy --prod` з корня.
# Збирає Vercel за налаштуваннями проєкту (Root Directory: frontend).
#
# Потрібен один секрет: VERCEL_TOKEN (vercel.com/account/tokens, scope — команда).
# Без нього робота нічого не робить. Вручну: Actions → Deploy frontend → Run workflow.

name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".vercelignore"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_SGZcqHqxCJv7hLEFo2tRpEtG
      VERCEL_PROJECT_ID: prj_koAhwqO2vPnghMrhUssXwHOFvtYy
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret is not set — nothing to do."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: "22"
      - name: Deploy to Vercel
        if: steps.config.outputs.enabled == 'true'
        run: npx --yes vercel@65.14.0 deploy --prod --yes --token "$VERCEL_TOKEN"
