# Render Free засинає після ~15 хв без запитів, і перше відкриття чекає до хвилини.
# Одного сервісу, що працює постійно (~744 год), вистачає 750 безкоштовних годин Render.
#
# Чому без `schedule:` у GitHub Actions:
# 1) у приватному репозиторії організації cron кожні 10 хв (~4320 запусків/міс) з'їдає
#    всі 2000 безкоштовних хвилин за ~2 тижні й блокує CI та автодеплой фронтенду;
# 2) GitHub затримує розклад на 15–40 хв, за які Render встигає заснути;
# 3) на Vercel Hobby вбудовані Cron Jobs дозволені лише раз на добу.
#
# Постійний пінг кожні 10 хв — через безкоштовний зовнішній крон (cron-job.org або
# UptimeRobot) на https://clarity-three-xi.vercel.app/api/health/ (проходить крізь
# Vercel → Render → Neon). Тут лишається ручний запуск (Actions → Keep API warm → Run workflow).

name: Keep API warm

on:
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_HEALTH_URL: ${{ vars.API_HEALTH_URL || 'https://clarity-three-xi.vercel.app/api/health/' }}
    steps:
      - name: Ping the API
        run: |
          # холодний старт триває до хвилини — чекаємо з запасом
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 5 "$API_HEALTH_URL"
