<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: сторінка йде під виріз і риску внизу; відступи — через env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- додана на головний екран, сторінка відкривається як застосунок — без адресного рядка й нижніх смуг браузера -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clarity" />
    <!-- адреса сторінки (зокрема публічного посилання з токеном) не йде іншим сайтам -->
    <meta name="referrer" content="same-origin" />
    <!-- колір верхньої й нижньої смуг браузера на телефоні; оновлюється з темою -->
    <meta name="theme-color" content="#ececec" />
    <title>Clarity — команда AI-учасників для важких рішень</title>
    <!-- og:start — типові теги сайту; /shared/<token> бекенд замінює їх тегами дискусії -->
    <meta name="description" content="Опишіть, що вас турбує: AI-учасники з різними характерами обговорять питання, AI Devil знайде слабкі місця, а модератор зведе все в чіткий висновок." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clarity" />
    <meta property="og:title" content="Clarity — команда AI-учасників для важких рішень" />
    <meta property="og:description" content="Одне питання — ціла команда думок: дебати AI-учасників, критика AI Devil і чіткий висновок з плюсами, ризиками й наступним кроком." />
    <!-- адресу картинки збірка робить абсолютною з VITE_SITE_URL (vite.config.js) -->
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:end -->
    <!-- шрифт — з власного сервера (@fontsource у main.jsx), без запитів до Google Fonts -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
