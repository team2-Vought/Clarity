<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -40 704 490" width="72" height="50">
  <!-- Clarity logo, "thinking" loop (2.4s). Petals: capsules r=96 from the core at (322,325). -->
  <defs>
    <linearGradient id="g-lav" x1="0" x2="1">
      <stop offset="0" stop-color="#f4f2ff"/><stop offset="0.45" stop-color="#d4d4ea"/><stop offset="1" stop-color="#bfc0db"/>
    </linearGradient>
    <linearGradient id="g-rose" x1="0" x2="1">
      <stop offset="0" stop-color="#fbe4ea"/><stop offset="0.5" stop-color="#e6c3c9"/><stop offset="1" stop-color="#cfa8ae"/>
    </linearGradient>
    <linearGradient id="g-olive" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#f3f0d9"/><stop offset="1" stop-color="#d5d1b2"/>
    </linearGradient>
    <linearGradient id="g-teal" x1="0" x2="1">
      <stop offset="0" stop-color="#e6fbff"/><stop offset="0.5" stop-color="#cbe6ea"/><stop offset="1" stop-color="#b3d1d6"/>
    </linearGradient>
    <linearGradient id="g-shine" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.7" stop-color="#fff" stop-opacity="0.9"/><stop offset="1" stop-color="#fff" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="g-core">
      <stop offset="0" stop-color="#fff"/><stop offset="0.75" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5a5a8a" flood-opacity="0.18"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) { .body, .shine, .all { animation: none; } }
    .body {
      transform-box: view-box; transform-origin: 322px 325px;
      animation: reach 2.4s cubic-bezier(.45,0,.25,1) infinite;
    }
    .shine { opacity: 0; animation: glint 2.4s ease-in-out infinite; }
    .p1 .body, .p1 .shine { animation-delay: 0s; }
    .p2 .body, .p2 .shine { animation-delay: .18s; }
    .p3 .body, .p3 .shine { animation-delay: .36s; }
    .p4 .body, .p4 .shine { animation-delay: .54s; }
    .p5 .body, .p5 .shine { animation-delay: .72s; }
    .core { transform-box: view-box; transform-origin: 322px 325px; animation: breathe 2.4s ease-in-out infinite; }
    .halo { transform-box: view-box; transform-origin: 322px 325px; animation: halo 2.4s ease-in-out infinite; }
    .all { transform-box: view-box; transform-origin: 322px 325px; animation: sway 2.4s ease-in-out infinite; }

    @keyframes reach {
      0%, 55%, 100% { transform: scale(1); }
      22% { transform: scale(1.07); }
    }
    @keyframes glint {
      0%, 55%, 100% { opacity: 0; }
      20% { opacity: .75; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(.9); opacity: .75; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes halo {
      0%, 100% { transform: scale(.85); opacity: .25; }
      50% { transform: scale(1.08); opacity: .6; }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-1.2deg) scale(.985); }
    }
  </style>

  <g class="all" filter="url(#soft)">
    <!-- petal along +x from the core, then rotated into place -->
    <g class="petal p1" transform="rotate(180 322 325)">
      <g class="body">
        <rect x="226" y="229" width="412" height="192" rx="96" fill="url(#g-lav)" fill-opacity=".82" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
        <rect class="shine" x="226" y="229" width="412" height="192" rx="96" fill="url(#g-shine)"/>
      </g>
    </g>
    <g class="petal p5" transform="rotate(0 322 325)">
      <g class="body">
        <rect x="226" y="229" width="412" height="192" rx="96" fill="url(#g-lav)" fill-opacity=".82" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
        <rect class="shine" x="226" y="229" width="412" height="192" rx="96" fill="url(#g-shine)"/>
      </g>
    </g>
    <g class="petal p2" transform="rotate(-140 322 325)">
      <g class="body">
        <rect x="226" y="229" width="412" height="192" rx="96" fill="url(#g-rose)" fill-opacity=".8" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
        <rect class="shine" x="226" y="229" width="412" height="192" rx="96" fill="url(#g-shine)"/>
      </g>
    </g>
    <g class="petal p4" transform="rotate(-40 322 325)">
      <g class="body">
        <rect x="226" y="229" width="412" height="192" rx="96" fill="url(#g-teal)" fill-opacity=".8" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
        <rect class="shine" x="226" y="229" width="412" height="192" rx="96" fill="url(#g-shine)"/>
      </g>
    </g>
    <g class="petal p3" transform="rotate(-90 322 325)">
      <g class="body">
        <rect x="226" y="229" width="412" height="192" rx="96" fill="url(#g-olive)" fill-opacity=".86" stroke="#fff" stroke-opacity=".8" stroke-width="2"/>
        <rect class="shine" x="226" y="229" width="412" height="192" rx="96" fill="url(#g-shine)"/>
      </g>
    </g>

    <circle class="halo" cx="322" cy="325" r="110" fill="#fff" filter="url(#blur)"/>
    <circle class="core" cx="322" cy="325" r="80" fill="url(#g-core)"/>
  </g>
</svg>
