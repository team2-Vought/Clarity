# Інтерфейс і API на одному домені: вхід живе в httpOnly-cookie з SameSite=Lax.
# TLS завершує зовнішній проксі чи балансувальник перед цим контейнером.
#
# Ланцюжок: клієнт → зовнішній проксі → цей nginx → Django. Тому nginx ДОПИСУЄ
# свою адресу в X-Forwarded-For (а не перезаписує його адресою зовнішнього
# проксі), а Django бере адресу перед двома проксі (DJANGO_NUM_PROXIES=2 у
# docker-compose.yml). Інакше всі люди мали б для лімітів одну IP-адресу —
# адресу зовнішнього проксі — і, наприклад, 5 реєстрацій на годину ділили б на всіх.

# HSTS лише коли зовнішній проксі каже, що запит прийшов по https
map $http_x_forwarded_proto $clarity_hsts {
    https "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # найбільший запит — файл вкладення (10 МБ) із запасом
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security $clarity_hsts always;
    add_header Referrer-Policy same-origin always;
    add_header X-Content-Type-Options nosniff always;
    # решту CSP збірка кладе в <meta>; frame-ancestors там не діє
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
    }
    # публічні посилання: бекенд додає OG-теги для прев'ю в месенджерах
    location /shared/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    # статика адмінки (whitenoise у бекенді)
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    # Адмінка: ввімкніть, підставивши свою DJANGO_ADMIN_URL замість staff-7f3a,
    # і обмежте доступ за IP (allow/deny) — двофакторного входу в ній немає.
    # location /staff-7f3a/ {
    #     # allow 203.0.113.10;
    #     # deny all;
    #     proxy_pass http://backend:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # }
    location / {
        try_files $uri /index.html;
    }
    # index.html не кешуємо: після деплою браузер одразу бере нові бандли.
    # add_header у location скасовує заголовки сервера — тож повторюємо їх
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security $clarity_hsts always;
        add_header Referrer-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
    # бандли мають хеш в імені — їх можна кешувати назавжди
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security $clarity_hsts always;
        add_header Referrer-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
